name: cotizo_app
description: Cotizaciones, materiales y rentabilidad sin conexión.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  image: ^4.5.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fuentes/Roboto-Regular.ttf
    - assets/fuentes/Roboto-Bold.ttf
    - assets/fuentes/LICENCIA.txt
