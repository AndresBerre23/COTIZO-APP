<div class="hidden fixed bottom-6 left-margin right-margin z-50 bg-tertiary text-on-tertiary p-space-md rounded-xl shadow-2xl flex items-center justify-between transform transition-all duration-300" id="success-toast">

<script>
  let currentAmount = "45.50";
  let activeCategory = "Gasolina";
  let hasReceipt = false;

  const displayEl = document.getElementById("amount-display");
  const projectToggle = document.getElementById("project-toggle");
  const projectMenu = document.getElementById("project-menu");
  const projectLabel = document.getElementById("project-label");
  const toast = document.getElementById("success-toast");
  const toastSummary = document.getElementById("toast-summary");

  function updateDisplay() {
    displayEl.textContent = currentAmount === "" ? "0.00" : currentAmount;
  }

  function pressKey(key) {
    if (key === ".") {
      if (!currentAmount.includes(".")) {
        currentAmount = currentAmount === "" ? "0." : currentAmount + ".";
      }
    } else {
      if (currentAmount === "0") {
        currentAmount = key;
      } else {
        const parts = currentAmount.split(".");
        if (parts.length === 2 && parts[1].length >= 2) {
          return;
        }
        if (currentAmount.length < 9) {
          currentAmount += key;
        }
      }
    }
    updateDisplay();
  }

  function pressBackspace() {
    if (currentAmount.length > 0) {
      currentAmount = currentAmount.slice(0, -1);
    }
    if (currentAmount === "") {
      currentAmount = "0";
    }
    updateDisplay();
  }

  function selectCategory(button, categoryName) {
    activeCategory = categoryName;
    const chips = document.querySelectorAll(".category-chip");
    chips.forEach(chip => {
      chip.className = "category-chip flex-shrink-0 h-10 px-space-sm rounded-full bg-surface-container-high text-on-surface shadow-sm flex items-center gap-1.5 active:scale-95 transition-all";
      const icon = chip.querySelector(".material-symbols-outlined");
      if (icon) icon.className = "material-symbols-outlined text-[18px] text-on-surface-variant";
      const text = chip.querySelector("span:last-child");
      if (text) text.className = "font-label-md text-label-md font-medium";
    });

    button.className = "category-chip flex-shrink-0 h-10 px-space-sm rounded-full bg-primary-container text-on-primary shadow-sm flex items-center gap-1.5 active:scale-95 transition-all";
    const activeIcon = button.querySelector(".material-symbols-outlined");
    if (activeIcon) activeIcon.className = "material-symbols-outlined text-[18px] text-on-primary";
    const activeText = button.querySelector("span:last-child");
    if (activeText) activeText.className = "font-label-md text-label-md font-semibold";
  }

  if (projectToggle && projectMenu) {
    projectToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      projectMenu.classList.toggle("hidden");
    });

    document.addEventListener("click", () => {
      projectMenu.classList.add("hidden");
    });
  }

  function selectProject(projectName) {
    if (projectLabel) projectLabel.textContent = projectName;
    if (projectMenu) projectMenu.classList.add("hidden");
  }

  function toggleReceiptState() {
    hasReceipt = !hasReceipt;
    const receiptBadge = document.getElementById("receipt-badge");
    const receiptIcon = document.getElementById("receipt-icon");
    const receiptBtn = document.getElementById("receipt-btn");

    if (hasReceipt) {
      receiptBadge.classList.remove("hidden");
      receiptIcon.textContent = "check_circle";
      receiptIcon.className = "material-symbols-outlined text-[20px] text-tertiary-container";
      receiptBtn.classList.add("bg-surface-container");
    } else {
      receiptBadge.classList.add("hidden");
      receiptIcon.textContent = "photo_camera";
      receiptIcon.className = "material-symbols-outlined text-[20px] text-secondary";
      receiptBtn.classList.remove("bg-surface-container");
    }
  }

  function handleSaveExpense() {
    const formattedAmount = currentAmount === "" ? "0.00" : currentAmount;
    toastSummary.textContent = "$" + formattedAmount + " • " + activeCategory;
    toast.classList.remove("hidden");
    toast.classList.add("flex");

    setTimeout(() => {
      toast.classList.add("hidden");
      toast.classList.remove("flex");
    }, 2800);
  }
</script></main>
